# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      # Hard dependencies only: the site's code uses grid lookups and the
      # InvCov baseline, so the GitHub-only method packages in Suggests
      # (JGL, spikeyglass, multiGGM) are not needed -- and pak cannot always
      # resolve them, which fails the whole build.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::pkgdown, any::knitr, any::rmarkdown, local::.
          needs: website

      # pkgdown renders every top-level .md file as a site page (it does not
      # honour .Rbuildignore). Keep only the public ones so internal notes
      # (CLAUDE.md, NOTES_*.md, TODOS_*.md, ...) are never published. This
      # only touches the CI checkout.
      - name: Drop internal markdown from the site
        run: |
          find . -maxdepth 1 -name '*.md' ! -name README.md ! -name NEWS.md \
            ! -name LICENSE.md -print -delete

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
